services:
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: employee360-backend
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - employee360-network

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: employee360-frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:8080
    networks:
      - employee360-network

networks:
  employee360-network:
    driver: bridge
